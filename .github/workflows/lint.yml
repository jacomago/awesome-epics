name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly link-rot check (Mondays 06:00 UTC).
    - cron: "0 6 * * 1"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pre-commit/action@v3.0.1

  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx awesome-lint

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --verbose README.md"
          fail: true
